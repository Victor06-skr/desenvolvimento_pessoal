<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lista de softwares</title>
    <style>
        table, th, td{
            border: 1px solid black;
            border-collapse: collapse;
            padding: 8px;
        }
        body{
        font-family: Arial, sans-serif
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th>Softwares</th>
                <th>Departamentos</th>
                <th>Quantidade de máquinas</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Microsoft Excel</td>
                <td>Financeiro e marketing</td>
                <td>5</td>
            </tr>
            <tr>
                <td>Adobe Photoshop</td>
                <td>Marketing</td>
                <td>2</td>
            </tr>
            <tr>
                <td>Microsoft Word</td>
                <td>Todos os departamentos</td>
                <td>25</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
